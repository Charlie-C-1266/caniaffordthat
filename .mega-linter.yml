# MegaLinter — non-code files only. The TypeScript/React source is linted by
# oxlint + typescript-eslint and formatted by Prettier (see the CI job and the
# npm scripts); MegaLinter covers what those don't: Markdown, YAML, the
# Dockerfile, GitHub Actions workflows, and secret scanning.
#
# The per-linter configs (.markdownlint.json, .yamllint.yml, .hadolint.yaml)
# live in .github/linters/, MegaLinter's default LINTER_RULES_PATH, rather than
# at the repository root. Only MegaLinter reads them.
APPLY_FIXES: none
SHOW_ELAPSED_TIME: true
FLAVOR_SUGGESTIONS: false
PRINT_ALPACA: false
PRINT_APPLY_FIXES_TIPS: false

# Results are read from the CI check and the uploaded megalinter-reports
# artifact, so MegaLinter doesn't comment on PRs. Its comment reporter looks
# the PR up through the GitHub API, which the workflow's read-only token
# (`permissions: contents: read`) isn't allowed to do in a private repo: the
# 403 failed the whole job even with every linter passing.
GITHUB_COMMENT_REPORTER: false

# zizmor audits the workflows for GitHub Actions security issues. Some of its
# audits ask GitHub's API about the actions we use (vulnerable versions, a tag
# that also names a branch), so it needs the job's token, which MegaLinter
# withholds from linters unless it's listed here. The workflow grants that
# token `contents: read` only.
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN

# Whitelist: only these descriptors run. Everything owned by the native
# toolchain (TypeScript, JavaScript, JSX, CSS, JSON, HTML) stays off, as do
# spell-check and copy-paste detection. Shell scripts are left to the plain
# shellcheck step in ci.yml, whose output reads more easily than this job's.
ENABLE:
  - MARKDOWN
  - YAML
  - DOCKERFILE
  - ACTION
  - REPOSITORY

# Trim the enabled descriptors to the linters worth running here: drop the
# formatters that would fight Prettier (yaml/prettier), the network-dependent
# link and schema checks, and the heavyweight security/SBOM scanners that are
# noise for a static client-side site — keeping secret detection.
DISABLE_LINTERS:
  - YAML_PRETTIER
  - YAML_V8R
  - MARKDOWN_MARKDOWN_LINK_CHECK
  - MARKDOWN_MARKDOWN_TABLE_FORMATTER
  - REPOSITORY_CHECKOV
  - REPOSITORY_DEVSKIM
  - REPOSITORY_DUSTILOCK
  - REPOSITORY_GRYPE
  - REPOSITORY_KICS
  - REPOSITORY_SEMGREP
  - REPOSITORY_SYFT
  - REPOSITORY_TRIVY
  - REPOSITORY_TRUFFLEHOG
  - REPOSITORY_CHECKMAKE

# Vendored, generated, and sub-project paths that aren't ours to lint.
FILTER_REGEX_EXCLUDE: (node_modules/|dist/|coverage/|package-lock\.json|scripts/og-image/)
