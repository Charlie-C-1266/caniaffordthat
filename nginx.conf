# Serves the built multi-page site: the calculator at /, plus /sources/ and
# /methodology/*/ as plain directory indexes.
#
# A note on the repetition below: nginx's `add_header` is inherited from the
# server block only by locations that set no `add_header` of their own. Each
# location here needs its own Cache-Control, which silently drops every
# server-level header — so the security headers are repeated in full in each
# one rather than set once above. Keep the three lists in sync.
#
# The security headers carry `always`, so error responses get them too.
# Cache-Control deliberately doesn't: without `always` nginx adds it only to
# successful responses, so a 404 is never cached. With it, a request for a
# hashed asset that isn't there yet (one replica ahead of another mid-deploy)
# would come back "immutable" for a year, and a mistyped page URL would hide
# a page published there later for an hour.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact nginx version in Server: / error pages.
    server_tokens off;

    # ── Compression ──────────────────────────────────────────────────────────
    # text/html is deliberately absent: nginx always compresses it when gzip
    # is on, and listing it again warns about a duplicate MIME type.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ── Vite's hashed build output ───────────────────────────────────────────
    # Every filename under /assets/ carries a content hash, so a given URL's
    # bytes never change — safe to cache for a year and never revalidate.
    # `^~` stops the .html regex below from ever claiming one of these.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        # A miss here is a stale deploy, not a page to recover — never fall
        # back to HTML, or the browser would parse markup as JS/CSS.
        try_files $uri =404;
    }

    # ── HTML ─────────────────────────────────────────────────────────────────
    # Matches both a direct /index.html hit and the internal redirect the
    # `index` directive makes for a directory (/ , /sources/, /methodology/…).
    # Must never be cached: it's the document that names the hashed assets, so
    # a stale copy pins visitors to a previous deploy's JS.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        try_files $uri =404;
    }

    # ── Everything else ──────────────────────────────────────────────────────
    # favicon.svg, og-image.png, and the directory indexes. `=404` replaces
    # the old blanket `/index.html` fallback: this is a multi-page site, so a
    # mistyped path is a broken link and should say so rather than returning
    # the calculator with a 200. The `index` directive above is what still
    # serves index.html for a directory, including `/` itself.
    location / {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        try_files $uri $uri/ =404;
    }
}
