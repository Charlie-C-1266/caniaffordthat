# Serves the built multi-page site: the calculator at /, plus /sources/ and
# /methodology/*/ as plain directory indexes.
#
# A note on the repetition below: nginx's `add_header` is inherited from the
# server block only by locations that set no `add_header` of their own. Each
# location here needs its own Cache-Control, which silently drops every
# server-level header — so the security headers are repeated in full in each
# one rather than set once above. Keep the three lists in sync.
#
# The security headers carry `always`, so error responses get them too.
# Cache-Control deliberately doesn't: without `always` nginx adds it only to
# successful responses, so a 404 is never cached. With it, a request for a
# hashed asset that isn't there yet (one replica ahead of another mid-deploy)
# would come back "immutable" for a year, and a mistyped page URL would hide
# a page published there later for an hour.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact nginx version in Server: / error pages.
    server_tokens off;

    # ── The branded 404 body ─────────────────────────────────────────────────
    # Replaces nginx's default plain error page for every `=404` below, so a
    # mistyped or stale link lands on something that looks like the site and
    # offers a way back. `error_page` without `=` keeps the response status at
    # 404, which is what a crawler needs to see.
    #
    # `internal` means the file is reachable only through this internal
    # redirect: a direct request for /404.html from outside is itself a 404,
    # so the page can't become a 200 duplicate-content route. (public/404.html
    # also carries `<meta name="robots" content="noindex">`, which is what
    # covers the Vercel deployment, where static files are served by path.)
    #
    # No Cache-Control here, deliberately: the `always`-less rule in the note
    # above means nginx won't cache a 404 anyway, and adding one would pin a
    # mistyped URL for an hour even after a page is published there.
    error_page 404 /404.html;

    # A directory that exists but holds no index.html — /methodology/, which
    # only contains salary/ and vehicle/ — makes nginx answer 403 Forbidden,
    # because `index` finds nothing and autoindex is off. That path is a
    # natural one to reach by trimming /methodology/salary/ back, and Vercel
    # answers it with a 404, so without this the two deployments disagree and
    # the one URL most likely to be trimmed is the only one still showing a
    # bare server error.
    #
    # `=404` *rewrites* the status (unlike the 404 line above, which must keep
    # its own): a 403 here means "no page", not "not allowed", so 404 is both
    # the honest answer and the one a crawler can act on. The directory case
    # is the only 403 this config produces: there are no deny or auth rules,
    # and every other miss already ends in `try_files … =404`. (A file nginx
    # can't read would also land here as a 404; the error log still names the
    # permission problem.)
    error_page 403 =404 /404.html;

    location = /404.html {
        internal;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # ── Compression ──────────────────────────────────────────────────────────
    # text/html is deliberately absent: nginx always compresses it when gzip
    # is on, and listing it again warns about a duplicate MIME type.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ── Vite's hashed build output ───────────────────────────────────────────
    # Every filename under /assets/ carries a content hash, so a given URL's
    # bytes never change — safe to cache for a year and never revalidate.
    # `^~` stops the .html regex below from ever claiming one of these.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        # A miss here is a stale deploy, not a page to recover — never fall
        # back to HTML, or the browser would parse markup as JS/CSS.
        try_files $uri =404;
    }

    # ── HTML ─────────────────────────────────────────────────────────────────
    # Matches both a direct /index.html hit and the internal redirect the
    # `index` directive makes for a directory (/ , /sources/, /methodology/…).
    # Must never be cached: it's the document that names the hashed assets, so
    # a stale copy pins visitors to a previous deploy's JS.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        try_files $uri =404;
    }

    # ── Everything else ──────────────────────────────────────────────────────
    # favicon.svg, og-image.png, and the directory indexes. `=404` replaces
    # the old blanket `/index.html` fallback: this is a multi-page site, so a
    # mistyped path is a broken link and should say so rather than returning
    # the calculator with a 200. The `index` directive above is what still
    # serves index.html for a directory, including `/` itself.
    location / {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        try_files $uri $uri/ =404;
    }
}
