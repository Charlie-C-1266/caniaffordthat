# Can I Afford That? — Docker Compose orchestration.
#
# Run `docker compose up -d --build` from the project root. This is a static,
# client-only site (no backend, no database) — the container just builds the
# Vite app and serves it via nginx. The Dockerfile and the nginx config it
# installs live in docker/; the build context stays the repository root.
#
# Serves on host port 4321 by default. Change the left half of the port
# mapping below (e.g. "9000:80") if that port is already taken.

services:
  caniaffordthat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: caniaffordthat:latest
    container_name: caniaffordthat
    restart: unless-stopped
    ports:
      - '4321:80'
