name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      # One run does both jobs: it fails the build on a failing test exactly as
      # `npm test` would, and the `text` reporter prints the per-file coverage
      # table straight into this job's log, so a reviewer can see a 0%-covered
      # file without reproducing the run locally. Deliberately no `thresholds`
      # in vite.config.ts — large parts of the app are mid-remediation, so
      # coverage must not gate the build. A threshold gate is a follow-up once
      # that backlog is closer to clear.
      - name: Test (with coverage)
        run: npm run test:coverage

      # The same run's `html` reporter output, kept browsable from the Actions
      # run. `if: always()` so the report still lands when a test fails —
      # that's exactly when the numbers are worth looking at.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: npx vite build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E test
        run: npm run test:e2e
