name: CI

# Every action is pinned to a full commit SHA, with its release as a trailing
# comment. A tag like `@v7` can be moved to point at different code (the 2025
# tj-actions/changed-files compromise worked that way); a SHA can't. Dependabot
# reads the comment and keeps both up to date. zizmor (in MegaLinter) checks
# this, and the rest of this file's hardening.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Least privilege: every job here only reads the repository. A job that ever
# needs more should ask for it on its own, rather than widening this.
permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      # Full history, so the UK-spelling step below can find the merge base
      # with the PR's target branch. `persist-credentials: false` keeps the
      # token out of .git/config, where a later step or an uploaded artifact
      # could expose it; nothing here pushes, and the spelling step only needs
      # history this checkout has already fetched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Node 24 LTS, the newest major Vercel builds the live site with. The
      # nginx job below, the Dockerfile, @types/node and the cap in
      # .github/dependabot.yml all name the same major, and
      # src/lib/dependabotConfig.test.ts fails if they drift apart.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      # shellcheck is preinstalled on the ubuntu-latest image.
      - name: Shellcheck
        run: shellcheck scripts/*.sh

      # Fails on US spellings in the lines a PR adds, with each one as an
      # annotation on the diff. Only PRs into dev: a dev → main release PR
      # carries lines that were already checked on their way into dev, plus
      # some from before this check existed, which a release shouldn't block on.
      - name: UK spelling (added lines)
        if: github.event_name == 'pull_request' && github.base_ref == 'dev'
        run: scripts/check-uk-spelling.sh origin/dev

      # One run does both jobs: it fails the build on a failing test exactly as
      # `npm test` would, and the `text` reporter prints the per-file coverage
      # table straight into this job's log, so a reviewer can see a 0%-covered
      # file without reproducing the run locally. Since #178 it is also the
      # gate: `coverage.thresholds` in vite.config.ts is a flat 100 on all
      # four metrics, so this step fails the build on the first uncovered
      # line. (When everything is covered the table prints empty — that is
      # the reporter showing a fully covered tree, not a broken run.)
      - name: Test (with coverage)
        run: npm run test:coverage

      # The same run's `html` reporter output, kept browsable from the Actions
      # run. `if: always()` so the report still lands when a test fails —
      # that's exactly when the numbers are worth looking at.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: npx vite build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E test
        run: npm run test:e2e

  nginx:
    name: Self-hosted nginx config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npx vite build

      - name: Install nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx-light

      # Serves the real ./dist through the repository's own nginx.conf and
      # asserts the cache, compression, security-header and 404 behaviour.
      - name: Verify nginx.conf
        run: bash scripts/verify-nginx.sh
