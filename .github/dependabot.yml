# Dependabot keeps this repo's dependencies current without anyone having to
# remember to look: the npm packages, the base images in the Dockerfile, and
# the actions pinned in the workflows. A security fix in any of them sitting
# unnoticed is the thing this exists to prevent.
#
# Everything targets dev rather than main: feature and fix PRs batch there and
# ship to main as one release PR (see the README's "Branching and releases").
#
# src/lib/dependabotConfig.test.ts checks this file parses, that each entry
# points at a directory that really holds that ecosystem's manifest, and that
# nothing drifts off dev.
version: 2

updates:
  # npm — React, Vite, Playwright, the Vercel analytics packages and the
  # toolchain in devDependencies.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Minor and patch bumps arrive as two PRs a week instead of twenty.
      # Majors are deliberately left ungrouped: each one gets its own PR,
      # where the breaking changes can be read properly.
      prod-deps:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-deps:
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(dev-deps)

  # GitHub Actions — actions/checkout, actions/setup-node, actions/upload-artifact
  # and the MegaLinter flavor, across both workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: chore(actions)

  # Docker — the node and nginx base images in the Dockerfile's two stages.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(docker)
